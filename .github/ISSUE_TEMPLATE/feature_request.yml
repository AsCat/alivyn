name: Feature request
description: Propose a product behavior or implementation improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What should the individual or its user be able to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include contact boundaries, memory effects, and a replay scenario if relevant.
    validations:
      required: true
